<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Intelligence Platform - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Crypto Intelligence</h1>
                <p>Market Intelligence & Trading Simulation</p>
            </div>

            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" data-tab="register" onclick="switchTab('register')">Register</button>
            </div>

            <div id="login-form" class="auth-form">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" name="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
                    </div>
                    <div id="login-error" class="error-message" style="display:none;"></div>
                    <button type="submit" class="btn btn-primary" id="login-btn">Sign In</button>
                </form>
            </div>

            <div id="register-form" class="auth-form" style="display:none;">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" name="name" placeholder="John Doe" required minlength="2">
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" name="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" name="password" placeholder="Min. 8 characters" required minlength="8">
                    </div>
                    <div class="form-group">
                        <label for="reg-confirm">Confirm Password</label>
                        <input type="password" id="reg-confirm" name="confirmPassword" placeholder="Re-enter password" required>
                    </div>
                    <div id="register-error" class="error-message" style="display:none;"></div>
                    <div id="register-success" class="success-message" style="display:none;"></div>
                    <button type="submit" class="btn btn-primary" id="register-btn">Create Account</button>
                </form>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
