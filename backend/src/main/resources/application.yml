server:
  port: ${PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:h2:mem:cryptointel;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  h2:
    console:
      enabled: ${H2_CONSOLE:true}

app:
  jwt:
    secret: ${JWT_SECRET:defaultDevSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm0123456789}
    expiration-ms: 86400000
  coingecko:
    base-url: https://api.coingecko.com/api/v3
    cache-duration-seconds: 30
  default-balance: 10000.00
  ai:
    enabled: ${AI_ENABLED:true}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.0-flash
    claude:
      api-key: ${CLAUDE_API_KEY:}
      model: claude-sonnet-4-20250514
    claude-haiku:
      model: claude-haiku-4-5-20251001
    cache:
      market-analysis-ttl-minutes: 15
      portfolio-risk-ttl-minutes: 10
      trade-reasoning-ttl-minutes: 5
    budget:
      daily-tokens-per-user: 100000
      global-daily-tokens: 5000000
    pattern-detection:
      enabled: ${PATTERN_DETECTION_ENABLED:true}
      interval-ms: 300000

logging:
  level:
    com.cryptointel: DEBUG
